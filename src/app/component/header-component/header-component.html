<div class="top-bar">
  <div class="container top-bar-inner">
    <p class="top-bar-info top-bar-address">
      <img src="/figma/icon-pin-14.svg" alt="" width="14" height="14">
      <span>Arap İbrahim Paşa Cd. No:98/A, 17010 Çanakkale</span>
    </p>
    <a class="top-bar-info top-bar-phone" href="tel:+902862127877">
      <img class="top-bar-phone-icon" src="/figma/icon-phone-14.svg" alt="" width="14" height="14">
      <img class="top-bar-phone-icon-mobile" src="/figma/icon-phone-12.svg" alt="" width="12" height="12">
      <span>Acil Durum Saha Ekibi · 0286 212 78 77</span>
    </a>
  </div>
</div>

<header class="nav-bar" #navBar>
  <div class="container nav-inner">
    <a class="brand" routerLink="/anasayfa" (click)="closeMenu()" aria-label="Canvet ana sayfa">
      <img src="/canvetlogo.png" alt="Canvet Veteriner Kliniği" width="170" height="51">
    </a>

    <nav class="nav-links" aria-label="Site menüsü">
      <a class="nav-link" routerLink="/anasayfa" routerLinkActive="active" [routerLinkActiveOptions]="exactPath">
        <span>Anasayfa</span>
        <img class="nav-indicator" src="/figma/nav-indicator.svg" alt="" width="5" height="5">
      </a>
      <a class="nav-link" routerLink="/anasayfa" fragment="hizmetler">
        <span>Hizmetler</span>
      </a>
      <a class="nav-link" routerLink="/iletisim" routerLinkActive="active">
        <span>İletişim</span>
        <img class="nav-indicator" src="/figma/nav-indicator.svg" alt="" width="5" height="5">
      </a>
    </nav>

    <div class="nav-actions">
      <a class="btn btn-primary nav-cta" routerLink="/iletisim">
        <img src="/figma/icon-calendar-btn.svg" alt="" width="18" height="18">
        <span>Randevu Planla</span>
      </a>

      <a class="icon-button call-button" href="tel:+902862127877" aria-label="Hemen ara">
        <img src="/figma/icon-phone-fact.svg" alt="" width="20" height="20">
      </a>
      <button class="icon-button menu-button" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen"
        aria-controls="mobile-menu" [attr.aria-label]="isMenuOpen ? 'Menüyü kapat' : 'Menüyü aç'">
        @if (isMenuOpen) {
          <img src="/figma/icon-x.svg" alt="" width="20" height="20">
        } @else {
          <img src="/figma/icon-menu.svg" alt="" width="20" height="20">
        }
      </button>
    </div>
  </div>

  <div class="mobile-menu" id="mobile-menu" [class.open]="isMenuOpen" [style.height]="menuHeight">
    <nav class="mobile-menu-links" aria-label="Mobil menü">
      <a class="mobile-menu-item" routerLink="/anasayfa" routerLinkActive="active"
        [routerLinkActiveOptions]="exactPath" (click)="closeMenu()">
        <span class="mobile-menu-label">
          <img class="mobile-menu-dot" src="/figma/menu-dot.svg" alt="" width="8" height="8">
          Anasayfa
        </span>
        <img src="/figma/icon-arrow-menu.svg" alt="" width="22" height="22">
      </a>
      <a class="mobile-menu-item" routerLink="/anasayfa" fragment="hizmetler" (click)="closeMenu()">
        <span class="mobile-menu-label">Hizmetler</span>
        <img src="/figma/icon-arrow-menu.svg" alt="" width="22" height="22">
      </a>
      <a class="mobile-menu-item" routerLink="/iletisim" routerLinkActive="active" (click)="closeMenu()">
        <span class="mobile-menu-label">
          <img class="mobile-menu-dot" src="/figma/menu-dot.svg" alt="" width="8" height="8">
          İletişim
        </span>
        <img src="/figma/icon-arrow-menu.svg" alt="" width="22" height="22">
      </a>
    </nav>

    <div class="mobile-menu-contact">
      <p>
        <img src="/figma/icon-pin-16.svg" alt="" width="16" height="16">
        <span>Arap İbrahim Paşa Cd. No:98/A, 17010 Çanakkale</span>
      </p>
      <a href="tel:+902862127877">
        <img src="/figma/icon-phone-16.svg" alt="" width="16" height="16">
        <span>0286 212 78 77</span>
      </a>
    </div>

    <a class="btn btn-primary mobile-menu-cta" routerLink="/iletisim" (click)="closeMenu()">
      <img src="/figma/icon-calendar-btn.svg" alt="" width="18" height="18">
      <span>Randevu Planla</span>
    </a>
  </div>
</header>
